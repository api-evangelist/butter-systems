name: Butter Systems
description: 'Butter Systems was a San Francisco restaurant-technology startup founded
  in 2013 by Sam Brin and Jon Li and backed by Y Combinator (batch S13). The company
  replaced the paper restaurant menu with a locked-down tablet at the table, letting
  diners browse an interactive menu, place food and drink orders on demand without
  waiting for a server, and request the check, while restaurant operators adjusted
  menu items, pricing, and promotions on the fly through a web back office. Butter
  Systems raised roughly $120K across two seed rounds in 2013 from Y Combinator and
  Fenox Venture Capital, and shut down in 2014. Y Combinator lists the company as
  inactive, and its buttersystems.com domain is now a parked "domain may be for sale"
  page. Butter Systems published no public API, developer portal, SDK, or machine-readable
  specification, and none survives in the Internet Archive record; it is retained
  in the API Evangelist network as a closed-company reference only.'
